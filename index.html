<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PEEKABOO · SH03 / 2.5D study</title>
  </head>
  <body>
    <main id="app-shell">
      <section class="stage-wrap" aria-label="SH03 animated frame">
        <div id="stage-host"></div>
        <div id="loading" class="loading">Loading original pixels…</div>
      </section>
      <aside class="debug-panel" aria-label="Development controls">
        <div class="eyebrow">PEEKABOO / SH03</div>
        <h1>躲藏的幸福 <span>10s 2.5D study</span></h1>
        <p class="dek">A quiet raster scene. The motion is local, named and deterministic.</p>
        <div class="transport">
          <button id="play" type="button">Play</button>
          <button id="pause" type="button">Pause</button>
          <button id="reset" type="button">Reset</button>
          <output id="time-readout">00:00.00</output>
        </div>
        <label class="scrub-label" for="scrub">Timeline <span>0:00 — 0:10</span></label>
        <input id="scrub" type="range" min="0" max="10" step="0.001" value="0" />
        <div class="control-grid">
          <label>Motion intensity <output id="intensity-readout">100%</output><input id="intensity" type="range" min="0" max="1.5" step="0.01" value="1" /></label>
          <label>Layer view <select id="source-mode"><option value="separated">Separated composite</option><option value="original">Original source A/B</option></select></label>
        </div>
        <div class="layer-list">
          <div class="layer-heading">Layer isolation</div>
          <label><input data-layer="school" type="checkbox" checked /> <span>BG_10 school + ground</span></label>
          <label><input data-layer="trunk" type="checkbox" checked /> <span>ENV_20 trunk / branches</span></label>
          <label><input data-layer="foliageRear" type="checkbox" checked /> <span>ENV_30 rear foliage</span></label>
          <label><input data-layer="boy" type="checkbox" checked /> <span>CHAR_40 boy</span></label>
          <label><input data-layer="foliageFront" type="checkbox" checked /> <span>ENV_50 front foliage</span></label>
          <label><input data-layer="shadow" type="checkbox" checked /> <span>FX_60 painted shadow pass</span></label>
          <label><input id="show-masks" type="checkbox" /> <span>Show mask borders</span></label>
        </div>
        <div class="export-row">
          <button id="export-frame" type="button">Export PNG frame</button>
          <span id="export-status" role="status">24 fps / silent</span>
        </div>
        <footer>
          Original: <code>IMG-001-tree-hide-v01.png</code><br />
          No Three.js. No generated replacement art.
        </footer>
      </aside>
    </main>
    <script src="/vendor/pixi.min.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
